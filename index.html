<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="theme-color" content="#17191d"><link rel="manifest" href="manifest.json"><title>GhostDraft</title><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui;--bg:#17191d;--fg:#e2e5e9;--panel:#242830;--accent:#a8b9e8}body[data-theme=light]{--bg:#faf9f6;--fg:#242424;--panel:#e9e7e2}body[data-theme=black]{--bg:#000;--panel:#171717}body[data-theme=sepia]{--bg:#eee3cc;--fg:#51432e;--panel:#dfd0b3}button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid #8885;border-radius:8px;padding:9px}button{cursor:pointer}button:focus-visible{outline:2px solid var(--accent)}header,footer{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}header strong{font-size:19px;margin-right:auto}footer{font-size:12px;opacity:.85}#app{height:100dvh;display:flex;flex-direction:column}#stage{position:relative;flex:1;min-height:0;overflow:hidden;width:100%;max-width:900px;margin:auto}#editor,#mirror{position:absolute;inset:0;margin:0;border:0;outline:0;padding:18px 20px;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;font:var(--size,18px)/1.65 var(--font,monospace);letter-spacing:0;overflow:auto;scrollbar-width:none;width:100%;height:100%;text-align:left}#editor{resize:none;background:transparent;color:transparent;caret-color:var(--fg);-webkit-text-fill-color:transparent}#editor::selection{background:#829bd455}#mirror{pointer-events:none;overflow:hidden;color:var(--fg)}#editor::placeholder{color:transparent}dialog{background:var(--bg);color:var(--fg);border:1px solid #8886;border-radius:16px;width:min(94vw,520px);max-height:85dvh;overflow:auto;padding:20px}dialog::backdrop{background:#0009}label{display:block;margin:14px 0 5px}input[type=range]{width:100%;padding:0}input[type=number]{width:100px}h2{margin-top:0}p{line-height:1.5}.line{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.muted{opacity:.65}#draftTitle{max-width:100%;flex:1;min-width:80px}#status{margin-left:auto}#mirror .hidden{color:transparent}#mirror .blurred{filter:blur(var(--blur));}#mirror .faded{opacity:var(--fad </style></head><body data-theme="dark"><div id="app"><header><strong>GhostDraft</strong><button id="draftsBtn">Drafts</button><button id="reveal">Reveal</button><button id="settingsBtn" aria-label="Settings">⚙</button></header><header style="padding-top:0"><input id="draftTitle" aria-label="Draft title"><button id="sprintBtn">Sprint</button><button id="exportBtn">Export</button></header><main id="stage"><div id="mirror" aria-hidden="true"></div><textarea id="editor" aria-label="Draft text" spellcheck="false" autocomplete="off" autocapitalize="sentences" placeholder="Begin anywhere…"></textarea></main><footer><span id="count"></span><span id="timer"></span><span id="status" role="status"></span></footer></div>
<dialog id="settings"><h2>Writing settings</h2><label>Visibility <select id="mode"><option>ghost</option><option>blur</option><option>fade</option><option>normal</option></select></label><label>Previous words visible: <output id="visibleOut"></output></label><input id="visible" type="range" min="0" max="100"><label>Blur strength</label><input id="blur" type="range" min="1" max="20"><label>Hidden text opacity (fade)</label><input id="fade" type="range" min="0" max="100"><label><input id="typewriter" type="checkbox"> Typewriter scrolling</label><label>Anchor position: <output id="anchorOut"></output>%</label><input id="anchor" type="range" min="10" max="90"><label>Theme <select id="theme"><option>dark</option><option>black</option><option>light</option><option>sepia</option></select></label><label>Font <select id="font"><option value="mono">Monospace</option><option value="serif">Serif</option><option value="sans">Sans serif</option></select></label><label>Font size <input id="size" type="number" min="12" max="36"></label><label>Editing <select id="restriction"><option value="unrestricted">Unrestricted</option><option value="visible">Visible words only</option><option value="current">Current word only</option><option value="locked">Append only</option></select></label><label><input id="spellcheck" type="checkbox"> Spellcheck</label><label>Daily net word goal <input id="goal" type="number" min="0" max="100000"></label><label><input id="showStats" type="checkbox"> Show goal and sprint WPM while writing</label><label>Writing profiles</label><div class="line"><input id="profileName" placeholder="Profile name"><button id="saveProfile">Save</button></div><div class="line"><select id="profiles"></select><button id="loadProfile">Load</button><button id="deleteProfile">Delete</button></div><button onclick="document.getElementById('settings').close()">Done</button></dialog>
<dialog id="drafts"><h2>Your drafts</h2><div id="draftList"></div><div class="line"><button id="newDraft" class="primary">New draft</button><button onclick="document.getElementById('drafts').close()">Close</button></div></dialog><dialog id="sprint"><h2>Writing sprint</h2><label>Minutes <input id="minutes" type="number" min="1" max="180" value="25"></label><div class="line"><button id="startSprint" class="primary">Start</button><button id="stopSprint">Finish sprint</button><button onclick="document.getElementById('sprint').close()">Close</button></div><h3>Session history</h3><div id="historyList"></div></dialog><dialog id="export"><h2>Keep your words safe</h2><p>Copy your draft into Google Docs, or save a plain text file. Backups include all drafts, settings, profiles and history.</p><div class="line"><button id="copy">Copy draft</button><button id="download">Text file</button><button id="backup">Full backup</button><button id="restore">Restore backup</button></div><input type="file" id="restoreFile" accept="application/json" hidden><p id="exportStatus" role="status"></p><button onclick="document.getElementById('export').close()">Close</button></dialog>
<script>
const $=id=>document.getElementById(id), ed=$('editor'), mirror=$('mirror');const defaults={mode:'ghost',visible:10,blur:12,fade:8,typewriter:true,anchor:85,theme:'dark',font:'mono',size:18,restriction:'unrestricted',spellcheck:false,goal:1000,showStats:false};const fresh=()=>({drafts:[{id:Date.now().toString(),title:'Untitled draft',text:''}],active:null,prefs:{...defaults},profiles:{},history:[],days:{}});let state=fresh(),storageOK=true;try{const raw=localStorage.getItem('ghostdraft-v1');if(raw)state=JSON.parse(raw)}catch(e){storageOK=false}state.prefs={...defaults,...state.prefs};if(!state.drafts.some(d=>d.id===state.active))state.active=state.drafts[0].id;let revealed=false,session=null,composing=false;const current=()=>state.drafts.find(d=>d.id===state.active), words=t=>t.trim()?t.trim().split(/\s+/u).length:0;const day=()=>new Date().toLocaleDateString('en-CA');function save(){try{localStorage.setItem('ghostdraft-v1',JSON.stringify(state));$('status').textContent='Saved locally';storageOK=true}catch(e){$('status').textContent='NOT SAVED — export now';storageOK=false}}function sync(){mirror.scrollTop=ed.scrollTop;mirror.scrollLeft=ed.scrollLeft}function boundary(t,pos,n){const before=t.slice(0,pos);const matches=[...before.matchAll(/\S+/gu)];const active=before.length&&!/\s$/u.test(before)?1:0;return matches[Math.max(0,matches.length-n-active)]?.index??pos}function render(anchor=true){const p=state.prefs,t=ed.value,pos=ed.selectionEnd;mirror.replaceChildren();let cut=boundary(t,pos,p.visible);const mode=revealed?'normal':p.mode;const hiddenClass={ghost:'hidden',blur:'blurred',fade:'faded'}[mode];function span(s,c){let a=document.createElement('span');a.textContent=s;if(c)a.className=c;mirror.append(a)}if(!t){span('Begin anywhere…','placeholder')}else{span(t.slice(0,cut),hiddenClass);span(t.slice(cut,pos));const marker=document.createElement('span');marker.id='caretMarker';marker.textContent='\u200b';mirror.append(marker);let end=pos;while(end<t.length&&!/\s/u.test(t[end]))end++;span(t.slice(pos,end));span(t.slice(end),hiddenClass);if(t.endsWith('\n'))span('\u200b');}if(p.typewriter&&anchor&&!composing&&$('caretMarker')){sync();const y=$('caretMarker').getBoundingClientRect().top-mirror.getBoundingClientRect().top+ed.scrollTop;ed.scrollTop=Math.max(0,y-ed.clientHeight*p.anchor/100)}sync();stats()}
function apply(){const p=state.prefs;document.body.dataset.theme=p.theme;document.body.style.setProperty('--font',{mono:'ui-monospace, monospace',serif:'Georgia, serif',sans:'system-ui, sans-serif'}[p.font]);document.body.style.setProperty('--size',p.size+'px');mirror.style.setProperty('--blur',p.blur+'px');mirror.style.setProperty('--fade',p.fade/100);ed.spellcheck=p.spellcheck;const pad=p.typewriter?Math.max(18,ed.clientHeight*(1-p.anchor/100)+p.size*2):18;ed.style.paddingBottom=mirror.style.paddingBottom=pad+'px';const top=p.typewriter?Math.max(18,ed.clientHeight*p.anchor/100):18;ed.style.paddingTop=mirror.style.paddingTop=top+'px';for(const k of Object.keys(defaults)){const e=$(k);if(e.type==='checkbox')e.checked=p[k];else e.value=p[k]}$('visibleOut').value=p.visible;$('anchorOut').value=p.anchor;render();save()}
function load(){ed.value=current().text;$('draftTitle').value=current().title;ed.setSelectionRange(ed.value.length,ed.value.length);apply()}function stats(){let s=words(ed.value)+' words';if(state.prefs.showStats)s+=' · Today '+(state.days[day()]||0)+'/'+state.prefs.goal;$('count').textContent=s;if(session){let sec=Math.max(0,Math.ceil((session.end-Date.now())/1000));$('timer').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+(state.prefs.showStats?' · '+Math.round((session.net||0)/Math.max(1,(Date.now()-session.start)/60000))+' WPM':'')}else $('timer').textContent=''}
ed.addEventListener('beforeinput',e=>{const p=state.prefs;if(revealed||p.restriction==='unrestricted'||e.isComposing)return;const t=ed.value,a=ed.selectionStart,b=ed.selectionEnd;let limit=p.restriction==='locked'?t.length:boundary(t,t.length,p.restriction==='current'?0:p.visible);if(a<limit||(e.inputType.startsWith('delete')&&a===limit&&a===b)||p.restriction==='locked'&&(e.inputType.startsWith('delete')||a!==t.length||b!==a))e.preventDefault()});ed.addEventListener('compositionstart',()=>composing=true);ed.addEventListener('compositionend',()=>{composing=false;render()});ed.addEventListener('input',()=>{let delta=words(ed.value)-words(current().text);state.days[day()]=Math.max(0,(state.days[day()]||0)+delta);if(session)session.net+=delta;current().text=ed.value;save();render()});ed.addEventListener('scroll',sync);for(const event of ['click','keyup','select'])ed.addEventListener(event,()=>render(false));document.addEventListener('selectionchange',()=>{if(document.activeElement===ed)render(false)});$('draftTitle').oninput=()=>{current().title=$('draftTitle').value;save()};$('reveal').onclick=()=>{revealed=!revealed;$('reveal').textContent=revealed?'Hide':'Reveal';render(false)};for(const k of Object.keys(defaults))$(k).oninput=()=>{let e=$(k);state.prefs[k]=e.type==='checkbox'?e.checked:typeof defaults[k]==='number'?Math.max(Number(e.min)||0,Math.min(Number(e.max)||100000,Number(e.value))):e.value;apply()};function profiles(){let e=$('profiles');e.replaceChildren();for(const k of Object.keys(state.profiles))e.add(new Option(k,k))}$('saveProfile').onclick=()=>{let n=$('profileName').value.trim();if(n){Object.defineProperty(state.profiles,n,{value:{...state.prefs},enumerable:true,configurable:true,writable:true});profiles();save()}};$('loadProfile').onclick=()=>{let p=state.profiles[$('profiles').value];if(p){state.prefs={...defaults,...p};apply()}};$('deleteProfile').onclick=()=>{delete state.profiles[$('profiles').value];profiles();save()};$('settingsBtn').onclick=()=>{profiles();$('settings').showModal()};function list(){let l=$('draftList');l.replaceChildren();for(const d of state.drafts){let row=document.createElement('div');row.className='line';let b=document.createElement('button');b.textContent=(d.id===state.active?'• ':'')+d.title+' ('+words(d.text)+')';b.onclick=()=>{if(session)finish();state.active=d.id;revealed=false;$('reveal').textContent='Reveal';load();$('drafts').close()};let del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{if(!confirm('Delete '+d.title+'? Export first if needed.'))return;if(session)finish();state.drafts=state.drafts.filter(x=>x.id!==d.id);if(!state.drafts.length)state.drafts=fresh().drafts;if(state.active===d.id)state.active=state.drafts[0].id;load();list()};row.append(b,del);l.append(row)}}$('draftsBtn').onclick=()=>{list();$('drafts').showModal()};$('newDraft').onclick=()=>{if(session)finish();let d={id:Date.now().toString(),title:'Untitled draft',text:''};state.drafts.push(d);state.active=d.id;load();$('drafts').close()};function history(){ $('historyList').textContent=state.history.slice().reverse().map(s=>new Date(s.date).toLocaleString()+' · '+s.title+' · '+s.net+' net words · '+s.minutes.toFixed(1)+' min · '+s.wpm+' WPM').join('\n')||'No sessions yet.'}function finish(){if(!session)return;let minutes=Math.max(1/60,(Math.min(Date.now(),session.end)-session.start)/60000);state.history.push({date:session.start,title:current().title,net:session.net,minutes,wpm:Math.round(session.net/minutes)});session=null;save();history();stats()}$('sprintBtn').onclick=()=>{history();$('sprint').showModal()};$('startSprint').onclick=()=>{if(session)finish();let m=Math.max(1,Math.min(180,Number($('minutes').value)||25));session={start:Date.now(),end:Date.now()+m*60000,net:0};$('sprint').close();stats()};$('stopSprint').onclick=finish;setInterval(()=>{if(session&&Date.now()>=session.end)finish();stats()},500);function download(name,text,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('exportBtn').onclick=()=>{$('exportStatus').textContent='';$('export').showModal()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(ed.value);$('exportStatus').textContent='Copied. Paste into Google Docs.'}catch(e){$('exportStatus').textContent='Clipboard unavailable. Use Text file instead.'}};$('download').onclick=()=>download(current().title+'.txt',ed.value,'text/plain');$('backup').onclick=()=>download('GhostDraft-backup.json',JSON.stringify(state,null,2),'application/json');$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{let s=JSON.parse(await e.target.files[0].text());if(!Array.isArray(s.drafts)||!s.drafts.length||!s.drafts.every(d=>typeof d.text==='string'&&typeof d.title==='string'&&typeof d.id==='string')||!s.drafts.some(d=>d.id===s.active)||!s.prefs||!Array.isArray(s.history)||!s.days||!s.profiles)throw Error();if(confirm('Replace all local drafts and settings with this backup?')){if(session)finish();state=s;state.prefs={...defaults,...s.prefs};load();$('exportStatus').textContent='Backup restored.'}}catch(e){$('exportStatus').textContent='Invalid backup.'}e.target.value=''};function resize(){if(window.visualViewport)$('app').style.height=window.visualViewport.height+'px';apply()}window.addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);load();resize();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
